name: Desktop multiplataforma
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            args: --win --x64
          - os: ubuntu-24.04
            target: linux-x64
            args: --linux --x64
          - os: macos-15
            target: macos-arm64
            args: --mac --arm64
          - os: macos-15-intel
            target: macos-x64
            args: --mac --x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Dependências Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0 libnss3 libasound2t64 libgbm1 xvfb
      - run: npm ci
      - run: npm test
      - name: Teste gráfico Linux
        if: runner.os == 'Linux'
        # CI-only: Ubuntu runners restrict Chromium user namespaces.
        run: xvfb-run -a npm run smoke -- --no-sandbox
      - name: Teste gráfico Windows e macOS
        if: runner.os != 'Linux'
        run: npm run smoke
      - name: Empacotar
        run: npm run dist -- ${{ matrix.args }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Checksums
        shell: bash
        run: node scripts/checksums.cjs
      - name: Testar pacote Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/packaged-smoke.cjs
      - name: Testar pacote Windows e macOS
        if: runner.os != 'Linux'
        run: node scripts/packaged-smoke.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: ligthscreenshot-${{ matrix.target }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.tar.gz
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
