name: Publicar prévia multiplataforma
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: ID de uma compilação Desktop multiplataforma concluída com sucesso
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Validar compilação de origem
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > run.json
          jq -e '.conclusion == "success" and .head_branch == "main" and .path == ".github/workflows/desktop.yml" and .event != "pull_request"' run.json
          SHA=$(jq -r '.head_sha' run.json)
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          COUNT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts | length')
          [[ "$COUNT" == 4 ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
      - name: Baixar pacotes e consolidar checksums
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir downloaded
          mkdir release
          find downloaded -type f \( -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.tar.gz' -o -name '*.dmg' -o -name '*.zip' \) -exec cp -n {} release/ \;
          test "$(find release -type f | wc -l)" -eq 8
          (cd release && sha256sum * > SHA256SUMS.txt)
      - name: Publicar v0.2.0 como prévia
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          gh release create v0.2.0 release/* --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --draft --prerelease --title 'ligthscreenshot v0.2.0 — prévia multiplataforma' --notes-file desktop/RELEASE_NOTES.md
          gh release view v0.2.0 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length' | grep -qx 9
          gh release edit v0.2.0 --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
